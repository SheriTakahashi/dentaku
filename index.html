<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>dentaku</title>
  </head>
  <body>
    <form name="dentaku">
      <table>
        <tr>
          <td colspan="4">
            <input
              type="text"
              class="display"
              name="display"
              value=""
              disabled
            />
          </td>
        </tr>
        <tr>
          <td>
            <button value="7" onclick="get_calc(this, event)">
              <i class="fa-solid fa-7"></i>
            </button>
          </td>
          <td>
            <button value="8" onclick="get_calc(this, event)">
              <i class="fa-solid fa-8"></i>
            </button>
          </td>
          <td>
            <button value="9" onclick="get_calc(this, event)">
              <i class="fa-solid fa-9"></i>
            </button>
          </td>
          <td>
            <button
              value="÷"
              class="operator"
              name="div_btn"
              onclick="get_calc(this, event)"
            >
              <i class="fa-solid fa-divide"></i>
            </button>
          </td>
        </tr>
        <tr>
          <td>
            <button value="4" onclick="get_calc(this, event)">
              <i class="fa-solid fa-4"></i>
            </button>
          </td>
          <td>
            <button value="5" onclick="get_calc(this, event)">
              <i class="fa-solid fa-5"></i>
            </button>
          </td>
          <td>
            <button value="6" onclick="get_calc(this, event)">
              <i class="fa-solid fa-6"></i>
            </button>
          </td>
          <td>
            <button
              value="×"
              class="operator"
              name="multi_btn"
              onclick="get_calc(this, event)"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </td>
        </tr>
        <tr>
          <td>
            <button value="1" onclick="get_calc(this, event)">
              <i class="fa-solid fa-1"></i>
            </button>
          </td>
          <td>
            <button value="2" onclick="get_calc(this, event)">
              <i class="fa-solid fa-2"></i>
            </button>
          </td>
          <td>
            <button value="3" onclick="get_calc(this, event)">
              <i class="fa-solid fa-3"></i>
            </button>
          </td>
          <td>
            <button value="-" class="operator" onclick="get_calc(this, event)">
              <i class="fa-solid fa-minus"></i>
            </button>
          </td>
        </tr>
        <tr>
          <td>
            <button value="AC" onclick="get_calc(this, event)">
              <i class="fa-solid fa-c"></i>
            </button>
          </td>
          <td>
            <button value="0" onclick="get_calc(this, event)">
              <i class="fa-solid fa-0"></i>
            </button>
          </td>
          <td>
            <button value="=" class="equal" onclick="get_calc(this, event)">
              <i class="fa-solid fa-equals"></i>
            </button>
          </td>
          <td>
            <button value="+" class="operator" onclick="get_calc(this, event)">
              <i class="fa-solid fa-plus"></i>
            </button>
          </td>
        </tr>
      </table>
    </form>
    <script src="script.js"></script>
    <script
      src="https://kit.fontawesome.com/a09f38c296.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
